<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>SmartFlow – Sign In</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet"/>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css" rel="stylesheet"/>
  <style>
    :root { --sf-blue: #0d3b6e; --sf-accent: #1a73e8; }
    body {
      background: linear-gradient(135deg, #0d3b6e 0%, #1a73e8 100%);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: 'Segoe UI', sans-serif;
      transition: background 0.3s ease;
    }
    .login-card {
      background: #fff;
      border-radius: 16px;
      box-shadow: 0 20px 60px rgba(0,0,0,.25);
      width: 100%;
      max-width: 420px;
      overflow: hidden;
      transition: all 0.3s ease;
    }
    .login-header {
      background: var(--sf-blue);
      color: #fff;
      padding: 2rem;
      text-align: center;
    }
    .login-header h2 {
      font-size: 1.8rem;
      font-weight: 800;
      letter-spacing: 1px;
      margin: 0;
    }
    .login-header h2 span { color: #7ec8f7; }
    .login-header p {
      margin: .4rem 0 0;
      font-size: .85rem;
      color: #cce5ff;
    }
    .login-body { padding: 2rem; }
    .form-control {
      border-radius: 8px;
      padding: .65rem 1rem;
      font-size: .92rem;
    }
    .form-control:focus {
      border-color: var(--sf-accent);
      box-shadow: 0 0 0 3px rgba(26,115,232,.15);
    }
    .input-group-text {
      background: #f4f7fb;
      border-radius: 8px 0 0 8px;
      color: #666;
    }
    .btn-login {
      background: var(--sf-blue);
      color: #fff;
      border: none;
      border-radius: 8px;
      padding: .7rem;
      font-size: 1rem;
      font-weight: 600;
      width: 100%;
      transition: background .2s;
    }
    .btn-login:hover { background: var(--sf-accent); color: #fff; }
    .error-msg {
      background: #f8d7da;
      color: #842029;
      border-radius: 8px;
      padding: .6rem 1rem;
      font-size: .85rem;
      margin-bottom: 1rem;
    }
    .login-footer {
      text-align: center;
      padding: 1rem 2rem;
      font-size: .78rem;
      color: #999;
      border-top: 1px solid #eee;
    }

    
    /* DARK MODE  */
    
    body.dark-mode {
      background: linear-gradient(135deg, #2d0b1e 0%, #4a1a32 100%) !important;
    }

    body.dark-mode .login-card {
      background: #2d0b1e !important;
      border: 1px solid #4a1a32 !important;
      box-shadow: 0 20px 60px rgba(0,0,0,.6) !important;
    }

    body.dark-mode .login-header {
      background: #3a1428 !important; 
      border-bottom: 2px solid #ffc700 !important; 
    }

    body.dark-mode .login-header h2 {
      color: #ffc700 !important; 
    }

    body.dark-mode .login-header h2 span {
      color: #ffffff !important; 
    }

    body.dark-mode .login-header p {
      color: #c9a96a !important; 
    }

    body.dark-mode .login-body h5 {
      color: #ffc700 !important; 
    }

    body.dark-mode .form-label {
      color: #ffffff !important;
    }

    body.dark-mode .form-control {
      background: #3a1428 !important; 
      color: #ffffff !important;
      border: 1px solid #4a1a32 !important;
    }

    body.dark-mode .form-control:focus {
      background: #3a1428 !important;
      color: #ffffff !important;
      border-color: #ffc700 !important; 
      box-shadow: 0 0 0 3px rgba(255, 199, 0, 0.2) !important;
    }

    body.dark-mode .input-group-text {
      background: #3a1428 !important;
      color: #ffc700 !important; 
      border: 1px solid #4a1a32 !important;
      border-right: none !important;
    }

    body.dark-mode .btn-login {
      background: #ffc700 !important;
      color: #2d0b1e !important; 
      font-weight: 700;
    }

    body.dark-mode .btn-login:hover {
      background: #ffd700 !important;
      color: #2d0b1e !important;
    }

    body.dark-mode .error-msg {
      background: rgba(255, 107, 107, 0.15) !important;
      color: #ff6b6b !important;
      border: 1px solid #ff6b6b !important;
    }

    body.dark-mode .login-footer {
      color: #c9a96a !important; 
      border-top: 1px solid #4a1a32 !important;
    }

    body.dark-mode .bi {
      color: #ffc700 !important;
    }
  </style>
</head>
<body>

<div class="login-card">
  <div class="login-header">
    <h2>Smart<span>Flow</span></h2>
    <p>TelOne Registry Department &mdash; Workflow Management System</p>
  </div>

  <div class="login-body">
    <h5 class="mb-4 text-center" style="color:#0d3b6e; font-weight:700;">
      <i class="bi bi-shield-lock me-2"></i>Sign In
    </h5>

    {% if form.errors %}
      <div class="error-msg">
        <i class="bi bi-exclamation-circle me-1"></i>
        Invalid username or password. Please try again.
      </div>
    {% endif %}

    <form method="post" novalidate>
      {% csrf_token %}

      <!-- Username -->
      <div class="mb-3">
        <label class="form-label fw-semibold">Username</label>
        <div class="input-group">
          <span class="input-group-text"><i class="bi bi-person"></i></span>
          {{ form.username }}
        </div>
      </div>

      <!-- Password -->
      <div class="mb-4">
        <label class="form-label fw-semibold">Password</label>
        <div class="input-group">
          <span class="input-group-text"><i class="bi bi-lock"></i></span>
          {{ form.password }}
        </div>
      </div>

      <button type="submit" class="btn-login">
        <i class="bi bi-box-arrow-in-right me-2"></i>Sign In
      </button>
    </form>
  </div>

  <div class="login-footer">
    &copy; 2026 SmartFlow &mdash; TelOne Centre for Learning &mdash; T2420016
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
<script>
    // Auto-apply dark mode from localStorage
    if (localStorage.getItem('darkMode') === 'true') {
        document.body.classList.add('dark-mode');
    }
</script>
</body>
</html>
