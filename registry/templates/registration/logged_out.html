<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>SmartFlow – Signed Out</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet"/>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css" rel="stylesheet"/>
  <style>
    body {
      background: linear-gradient(135deg, #0d3b6e 0%, #1a73e8 100%);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: 'Segoe UI', sans-serif;
    }
    .logout-card {
      background: #fff;
      border-radius: 16px;
      box-shadow: 0 20px 60px rgba(0,0,0,.25);
      max-width: 400px;
      width: 100%;
      text-align: center;
      overflow: hidden;
    }
    .logout-header {
      background: #0d3b6e;
      color: #fff;
      padding: 1.8rem;
    }
    .logout-header h2 { font-size:1.7rem; font-weight:800; margin:0; }
    .logout-header h2 span { color: #7ec8f7; }
    .logout-body { padding: 2.5rem 2rem; }
    .logout-icon {
      font-size: 3.5rem;
      color: #198754;
      margin-bottom: 1rem;
    }
    .logout-body h5 { color:#0d3b6e; font-weight:700; margin-bottom:.5rem; }
    .logout-body p  { color:#666; font-size:.9rem; }
    .btn-signin {
      background: #0d3b6e;
      color: #fff;
      border: none;
      border-radius: 8px;
      padding: .65rem 2rem;
      font-weight: 600;
      text-decoration: none;
      display: inline-block;
      margin-top: 1rem;
      transition: background .2s;
    }
    .btn-signin:hover { background: #1a73e8; color: #fff; }
    .logout-footer {
      font-size: .76rem;
      color: #aaa;
      padding: .8rem;
      border-top: 1px solid #eee;
    }
  </style>
</head>
<body>

<div class="logout-card">
  <div class="logout-header">
    <h2>Smart<span>Flow</span></h2>
  </div>

  <div class="logout-body">
    <div class="logout-icon">
      <i class="bi bi-check-circle-fill"></i>
    </div>
    <h5>You have been signed out</h5>
    <p>Your session has ended securely.<br>Thank you for using SmartFlow.</p>
    <a href="{% url 'login' %}" class="btn-signin">
      <i class="bi bi-box-arrow-in-right me-2"></i>Sign In Again
    </a>
  </div>

  <div class="logout-footer">
    &copy; 2026 SmartFlow &mdash; TelOne Registry Department
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
