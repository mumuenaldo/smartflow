<script>
// Turns any AI JSON response into readable, human-friendly text.
// Works with any field names the backend returns.
function humanizeKey(key) {
    return key.replace(/_/g, ' ').replace(/\b\w/g, c => c.toUpperCase());
}

function formatAIResponse(data, indent = '') {
    if (data === null || data === undefined) return 'No data returned.';

    if (typeof data === 'string') return data;
    if (typeof data === 'number' || typeof data === 'boolean') return String(data);

    if (Array.isArray(data)) {
        if (data.length === 0) return 'None';
        return data.map(item => {
            if (item !== null && typeof item === 'object') {
                return indent + '• ' + formatAIResponse(item, indent + '  ').replace(/\n/g, '\n' + indent + '  ');
            }
            return indent + '• ' + item;
        }).join('\n');
    }

    if (typeof data === 'object') {
        return Object.entries(data).map(([key, value]) => {
            const label = humanizeKey(key);
            if (Array.isArray(value)) {
                if (value.length === 0) return `${indent}${label}: None`;
                return `${indent}${label}:\n` + formatAIResponse(value, indent + '  ');
            }
            if (value !== null && typeof value === 'object') {
                return `${indent}${label}:\n` + formatAIResponse(value, indent + '  ');
            }
            return `${indent}${label}: ${value}`;
        }).join('\n');
    }

    return String(data);
}

//  AI tool runner//
function runAITool(resultElId, url) {
    const box = document.getElementById(resultElId);
    if (!box) return;
    box.innerHTML = '<span class="sf-status-pending"><i class="bi bi-hourglass-split me-1"></i>Thinking...</span>';

    fetch(url)
        .then(r => r.json())
        .then(data => {
            if (data.success) {
                const readable = formatAIResponse(data.data);
                box.innerHTML = `<span class="sf-status-done"><i class="bi bi-check-circle me-1"></i>Done</span>\n${readable}`;
            } else {
                box.innerHTML = `<span class="sf-status-error"><i class="bi bi-x-circle me-1"></i>${data.error || 'Something went wrong'}</span>`;
            }
        })
        .catch(() => {
            box.innerHTML = '<span class="sf-status-error"><i class="bi bi-wifi-off me-1"></i>Connection error — check your AI service is running</span>';
        });
}
</script>
