<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Secure Gateway — SmartFlow</title>
  
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
  
  <style>
    
    body {
      
      background: radial-gradient(circle at center, #0b2240 0%, #061324 100%);
      height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      margin: 0;
      overflow: hidden;
      transition: background 0.4s ease;
    }

    /* NIGHT MODE: High-fashion rich burgundy radial canvas */
    body.dark-mode {
      background: radial-gradient(circle at center, #2d0b1e 0%, #17040e 100%);
    }

    /* Floating Deep Ocean Particles */
    .bubbles {
      position: absolute;
      width: 100%;
      height: 100%;
      overflow: hidden;
      z-index: 0;
    }
    .bubbles span {
      position: absolute;
      bottom: -200px;
      width: 120px;
      height: 120px;
      background: radial-gradient(circle, rgba(0, 242, 254, 0.4), rgba(0, 242, 254, 0.05));
      border-radius: 50%;
      animation: rise 22s infinite ease-in-out;
      filter: blur(4px);
    }
    .bubbles span:nth-child(1) { left: 10%; animation-delay: 0s; }
    .bubbles span:nth-child(2) { left: 25%; animation-delay: 5s; width: 150px; height: 150px; }
    .bubbles span:nth-child(3) { left: 45%; animation-delay: 10s; width: 100px; height: 100px; }
    .bubbles span:nth-child(4) { left: 65%; animation-delay: 15s; width: 180px; height: 180px; }
    .bubbles span:nth-child(5) { left: 85%; animation-delay: 20s; width: 130px; height: 130px; }

    @keyframes rise {
      0% { transform: translateY(0) scale(1); opacity: 0.3; }
      50% { transform: translateY(-50vh) scale(1.15); opacity: 0.6; }
      100% { transform: translateY(-120vh) scale(0.9); opacity: 0; }
    }

    /* Explosive High-Fashion Pink Particles */
    .pink-bubbles {
      position: absolute;
      right: 0;
      top: 0;
      width: 40%;
      height: 100%;
      overflow: hidden;
      z-index: 0;
    }
    .pink-bubbles span {
      position: absolute;
      bottom: -200px;
      width: 140px;
      height: 140px;
      background: radial-gradient(circle, rgba(255, 0, 180, 0.35), rgba(255, 0, 180, 0.02));
      border-radius: 50%;
      animation: riseExplode 18s infinite ease-in-out;
      filter: blur(3px);
    }
    .pink-bubbles span:nth-child(1) { right: 10%; animation-delay: 0s; }
    .pink-bubbles span:nth-child(2) { right: 20%; animation-delay: 4s; width: 160px; height: 160px; }
    .pink-bubbles span:nth-child(3) { right: 30%; animation-delay: 8s; width: 120px; height: 120px; }

    @keyframes riseExplode {
      0%   { transform: translateY(0) scale(1); opacity: 0.4; }
      40%  { transform: translateY(-40vh) scale(1.2); opacity: 0.7; box-shadow: 0 0 30px rgba(255, 0, 180, 0.2); }
      80%  { transform: translateY(-80vh) scale(1.05); opacity: 0.5; }
      100% { transform: translateY(-120vh) scale(0.9); opacity: 0; }
    }

    
    .gateway-card {
      position: relative;
      z-index: 1;
      background: rgba(255, 255, 255, 0.03);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      border: 1px solid rgba(255, 255, 255, 0.1);
      border-radius: 28px;
      padding: 3.5rem;
      width: 100%;
      max-width: 480px;
      box-shadow: 0 25px 55px rgba(0, 0, 0, 0.45);
      animation: fadeIn 1s cubic-bezier(0.16, 1, 0.3, 1);
    }


    body:not(.dark-mode) .gateway-card {
      box-shadow: 0 0 40px rgba(0, 242, 254, 0.15), 0 25px 55px rgba(0, 0, 0, 0.45);
      border-color: rgba(0, 242, 254, 0.2);
    }
    body.dark-mode .gateway-card {
      box-shadow: 0 0 40px rgba(250, 204, 21, 0.12), 0 25px 55px rgba(0, 0, 0, 0.5);
      border-color: rgba(250, 204, 21, 0.2);
    }

    /*  Security Badge */
    .security-icon {
      font-size: 3.8rem;
      color: #00f2fe;
      display: inline-block;
      filter: drop-shadow(0 0 15px rgba(0, 242, 254, 0.6));
      animation: pulse 2.5s ease-in-out infinite;
    }
    body.dark-mode .security-icon {
      color: #facc15;
      filter: drop-shadow(0 0 15px rgba(250, 204, 21, 0.5));
    }

    /*  Input Fields */
    .sf-input-glass {
      background: rgba(0, 0, 0, 0.3) !important;
      border: 1px solid rgba(255, 255, 255, 0.15) !important;
      color: #ffffff !important;
      letter-spacing: 6px;
      font-size: 1.25rem;
      border-radius: 14px;
      transition: all 0.3s ease;
    }
    .sf-input-glass:focus {
      background: rgba(0, 0, 0, 0.45) !important;
      border-color: #00f2fe !important;
      box-shadow: 0 0 15px rgba(0, 242, 254, 0.25) !important;
    }
    body.dark-mode .sf-input-glass:focus {
      border-color: #facc15 !important;
      box-shadow: 0 0 15px rgba(250, 204, 21, 0.25) !important;
    }
    .sf-input-glass::placeholder {
      letter-spacing: normal;
      font-size: 1rem;
      color: rgba(255, 255, 255, 0.3);
    }

    /* Custom Button Actions */
    .btn-gateway {
      background: linear-gradient(90deg, #ff00d4 0%, #0072ff 100%);
      border: none;
      color: #fff;
      font-weight: 700;
      border-radius: 14px;
      padding: 12px 24px;
      font-size: 1rem;
      letter-spacing: 0.5px;
      transition: all 0.4s cubic-bezier(0.16, 1, 0.3, 1);
    }
    body.dark-mode .btn-gateway {
      background: linear-gradient(90deg, #d946ef 0%, #facc15 100%);
    }
    .btn-gateway:hover {
      transform: translateY(-3px);
      color: #ffffff;
      box-shadow: 0 12px 25px rgba(0, 242, 254, 0.3);
    }
    body.dark-mode .btn-gateway:hover {
      box-shadow: 0 12px 25px rgba(250, 204, 21, 0.25);
    }
    .btn-gateway:active {
      transform: translateY(-1px);
    }

    /* Keyframes Initialization */
    @keyframes pulse {
      0%, 100% { transform: scale(1); filter: drop-shadow(0 0 12px rgba(0,242,254,0.4)); }
      50% { transform: scale(1.06); filter: drop-shadow(0 0 22px rgba(0,242,254,0.7)); }
    }
    body.dark-mode @keyframes pulse {
      0%, 100% { transform: scale(1); filter: drop-shadow(0 0 12px rgba(250,204,21,0.3)); }
      50% { transform: scale(1.06); filter: drop-shadow(0 0 22px rgba(250,204,21,0.6)); }
    }
    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(20px); }
      to { opacity: 1; transform: translateY(0); }
    }

    /* Theme Switch Button  */
    .theme-toggle-btn {
      position: absolute;
      top: 25px;
      right: 25px;
      z-index: 10;
      background: rgba(255, 255, 255, 0.05);
      border: 1px solid rgba(255, 255, 255, 0.1);
      color: #ffffff;
      padding: 10px;
      border-radius: 50%;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: all 0.3s ease;
    }
    .theme-toggle-btn:hover {
      background: rgba(255, 255, 255, 0.15);
      transform: scale(1.05);
    }
  </style>
</head>
<body>


<button class="theme-toggle-btn" id="themeToggler" title="Toggle System Layout Matrix">
  <i class="bi bi-moon-stars-fill" id="themeIcon"></i>
</button>


<div class="bubbles">
  <span></span><span></span><span></span><span></span><span></span>
</div>

<div class="pink-bubbles">
  <span></span><span></span><span></span>
</div>


<div class="gateway-card text-center text-white">
  <div class="mb-5">
    <div class="security-icon mb-3">
      <i class="bi bi-shield-lock-fill"></i>
    </div>
    <h3 class="fw-bold tracking-tight">SmartFlow Gateway</h3>
    <p class="text-white-50 small mb-0">Authorized Infrastructure Access Matrix Only</p>
  </div>

  <form method="POST" action="{% url 'admin_welcome' %}">
    {% csrf_token %}
    
    <div class="mb-4 text-start">
      <label for="admin_key" class="form-label text-white-50 small fw-bold text-uppercase tracking-wider">
        Admin Security Key
      </label>
      <input type="password" name="admin_key" id="admin_key" 
             class="form-control form-control-lg sf-input-glass text-center" 
             placeholder="••••••••••••" required autocomplete="off" autofocus>
    </div>

    {% if error %}
      <div class="alert alert-danger bg-danger-subtle border-danger-subtle text-danger-emphasis text-center small mb-4 py-2 rounded-3" role="alert">
        <i class="bi bi-exclamation-triangle-fill me-2"></i> Invalid deployment key — access denied.
      </div>
    {% endif %}

    <button type="submit" class="btn btn-gateway btn-lg w-100 shadow-sm mt-2">
      Unlock Gateway <i class="bi bi-arrow-right-short ms-1"></i>
    </button>
  </form>
</div>

<script>
  
  const toggler = document.getElementById('themeToggler');
  const themeIcon = document.getElementById('themeIcon');
  
   
  if (localStorage.getItem('theme') === 'dark-mode') {
    document.body.classList.add('dark-mode');
    themeIcon.className = 'bi bi-sun-fill';
  }

  toggler.addEventListener('click', () => {
    document.body.classList.toggle('dark-mode');
    if (document.body.classList.contains('dark-mode')) {
      themeIcon.className = 'bi bi-sun-fill';
      localStorage.setItem('theme', 'dark-mode');
    } else {
      themeIcon.className = 'bi bi-moon-stars-fill';
      localStorage.setItem('theme', 'light-mode');
    }
  });
</script>
</body>
</html>
